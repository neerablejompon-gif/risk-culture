<script>
/* 7.4 งานของฉัน — ออกแบบ mobile-first (≤480px) แต่ใช้บน desktop ได้ */
(function () {
  const U = window.UI, h = U.h, icon = U.icon;
  const TABS = [['todo', 'ต้องส่ง'], ['review', 'รอตรวจ'], ['done', 'เสร็จ']];

  function taskChip(t) {
    if (t.state === 'RETURNED') return h('span', { class: 'chip st-risk' }, h('span', { 'aria-hidden': 'true' }, '↩'), ' ส่งกลับแก้ไข');
    if (t.overdueDays > 0) return h('span', { class: 'chip st-late' }, h('span', { 'aria-hidden': 'true' }, '!'), ' เลยกำหนด ' + t.overdueDays + ' วัน');
    if (!t.state || t.state === 'DRAFT') return h('span', { class: 'chip st-na' }, h('span', { 'aria-hidden': 'true' }, '○'), t.state ? ' ร่าง' : ' ยังไม่เริ่ม');
    return U.wchip(t.state);
  }

  function card(t, fy, tab) {
    const primary = tab === 'todo' && (t.overdueDays > 0 || t.state === 'RETURNED' || t.state === 'DRAFT');
    const cta = tab !== 'todo' ? 'ดูรายงาน' : t.state === 'RETURNED' ? 'แก้ไขตามความเห็น' : t.state === 'DRAFT' ? 'ทำร่างต่อ' : 'รายงานผลรอบนี้';
    return h('li', { class: 'glass task' },
      h('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap' },
        h('span', { style: 'font-size:13px;font-weight:700;color:var(--brand-700)' }, h('span', { class: 'num' }, t.no), ' · ' + t.value_name), taskChip(t)),
      h('div', { style: 'font-weight:600;line-height:1.5' }, t.name),
      t.state === 'RETURNED' && t.return_comment ? h('div', { class: 'quote' }, '“' + t.return_comment + '”') : null,
      h('div', { style: 'display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text-2);flex-wrap:wrap' },
        h('span', null, 'ผล ', h('strong', { class: 'num', style: 'color:var(--text)' }, U.fmtNum(t.value) + ' / ' + U.fmtNum(t.target_value) + ' ' + t.unit)),
        h('span', { style: 'font-weight:600;color:' + (t.overdueDays > 0 && tab === 'todo' ? 'var(--late-fg)' : 'var(--text-2)') },
          'รอบ ' + U.periodLabel(fy, t.period) + ' · ส่ง ' + U.fmtDate(t.due))),
      U.link('report', { id: t.activity_id, period: t.period }, { class: 'btn cta ' + (primary ? 'btn-p' : 'btn-g') }, cta));
  }

  window.Views.mytasks = async function (main, params, ctx) {
    const d = await U.api('apiGetMyTasks');
    if (!ctx.alive()) return;
    let tab = TABS.some(function (x) { return x[0] === params.tab; }) ? params.tab : 'todo';
    const alerts = d.tasks.todo.filter(function (t) { return t.overdueDays > 0 || t.state === 'RETURNED'; }).length;
    const list = h('ul', { class: 'tasks', role: 'tabpanel', id: 'tp' });
    const tabs = TABS.map(function (x) {
      return h('button', { type: 'button', role: 'tab', id: 'tab-' + x[0], 'aria-controls': 'tp', onclick: function () { tab = x[0]; draw(); },
        onkeydown: function (e) {
          const i = TABS.findIndex(function (y) { return y[0] === tab; });
          const n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
          if (!n) return;
          tab = TABS[(i + n + TABS.length) % TABS.length][0];
          draw();
          document.getElementById('tab-' + tab).focus();
        } }, x[1] + ' ', h('span', { class: 'num' }, '(' + d.tasks[x[0]].length + ')'));
    });
    function draw() {
      tabs.forEach(function (b, i) {
        const on = TABS[i][0] === tab;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
      });
      list.setAttribute('aria-labelledby', 'tab-' + tab);
      const items = d.tasks[tab];
      U.fill(list, items.length ? items.map(function (t) { return card(t, d.fy, tab); })
        : [h('li', { class: 'glass empty', style: 'grid-column:1/-1' }, icon('check'),
          h('p', { style: 'margin:0', class: 'muted' }, tab === 'todo' ? 'ไม่มีรายงานที่ต้องส่ง' : tab === 'review' ? 'ไม่มีรายงานที่รอตรวจ' : 'ยังไม่มีรายงานที่อนุมัติ'))]);
    }

    const r = d.round;
    U.fill(main, 
      h('header', { style: 'display:flex;align-items:center;justify-content:space-between;gap:12px' },
        h('div', { style: 'display:flex;align-items:center;gap:12px' },
          h('div', { class: 'avatar', style: 'width:44px;height:44px;background:var(--brand-600);color:#fff', 'aria-hidden': 'true' }, (d.user.display_name || '?').charAt(0).toUpperCase()),
          h('div', { style: 'line-height:1.35' }, h('div', { class: 'muted', style: 'font-size:13px' }, 'สวัสดี'),
            h('h1', { id: 'page-title', tabindex: '-1', style: 'font-size:20px;font-weight:700' }, d.user.display_name, h('span', { class: 'sr' }, ' — งานของฉัน')))),
        h('button', { type: 'button', class: 'glass iconbtn', style: 'position:relative;width:44px;height:44px;color:var(--brand-800)',
          'aria-label': 'การแจ้งเตือน ' + alerts + ' รายการ (ค้างส่งหรือถูกส่งกลับ)', onclick: function () { tab = 'todo'; draw(); list.scrollIntoView({ behavior: 'smooth' }); } },
          icon('bell'), alerts ? h('span', { 'aria-hidden': 'true', class: 'num', style: 'position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--risk-c);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)' }, alerts) : null)),
      !d.assigned ? U.banner('info', 'ยังไม่ได้รับมอบหมายกิจกรรม', 'ผู้ดูแลระบบต้องเพิ่มอีเมลของคุณในคอลัมน์ owner_emails ของ cfg_Activities') : null,
      r.p ? h('section', { class: 'hero', 'aria-label': 'รอบรายงานล่าสุด' },
        h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:#DDF1E6' },
          h('span', { style: 'font-weight:600' }, 'รอบรายงาน ' + U.periodLabel(d.fy, r.p)), h('span', null, 'ครบกำหนด ' + U.fmtDate(r.due))),
        h('div', { class: 'num', style: 'font-size:30px;font-weight:700;margin-top:4px' }, 'ส่งแล้ว ' + r.sent, h('span', { style: 'font-size:18px;font-weight:500' }, ' / ' + r.planned + ' กิจกรรม')),
        h('div', { style: 'margin-top:10px' }, U.progress(r.planned ? r.sent / r.planned : 0, 'ส่งรายงานแล้ว ' + r.sent + ' จาก ' + r.planned))) : null,
      h('div', { role: 'tablist', 'aria-label': 'สถานะงาน', class: 'glass seg' }, tabs),
      list);
    draw();
  };
})();
</script>
