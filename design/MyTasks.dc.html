<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>งานของฉัน (มือถือ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
a{color:#0B6B41}a:hover{color:#0B5C37}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid #0F7A4A;outline-offset:2px}
.glass{background:rgba(255,255,255,.64);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(12,64,40,.05),0 10px 30px rgba(12,64,40,.07);border-radius:16px}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(255,255,255,.92)}}
.num{font-variant-numeric:tabular-nums}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.6}
.s-done{background:#DDF1E6;color:#0B5C37}.s-ok{background:#E8F6EE;color:#14653F}.s-late{background:#FDECC8;color:#7A4100}.s-risk{background:#FDE3D6;color:#9A2B06}.s-na{background:#ECF0EE;color:#3F5A4D}.s-info{background:#E7EEF9;color:#1E4A85}
.seg{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:#2E4A3D;font-weight:600;cursor:pointer}
.seg[aria-selected="true"]{background:#FFFFFF;color:#0B5C37;box-shadow:0 2px 8px rgba(12,64,40,.12)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;font-weight:600;text-decoration:none;font-size:15px}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12px;font-weight:600;color:#2E4A3D;text-decoration:none}
.bn.on{color:#0B5C37}
.scr{scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 15px; line-height: 1.6; color: #0F2A1F; background: radial-gradient(500px 360px at 0% -5%, #CDEEDB 0%, transparent 60%), radial-gradient(420px 320px at 100% 40%, #DFF3E8 0%, transparent 60%), #F4FAF6">
<div class="scr" style="position: absolute; inset: 0 0 72px 0; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 999px; background: #0F7A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">J</div>
<div style="line-height: 1.35"><div style="font-size: 13px; color: #3F5A4D">สวัสดี</div><div style="font-size: 20px; font-weight: 700">Jom</div></div>
</div>
<button type="button" class="glass" aria-label="การแจ้งเตือน 2 รายการใหม่" style="position: relative; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0B5C37; padding: 0">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span aria-hidden="true" class="num" style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: #C2410C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #F4FAF6">2</span>
</button>
</header>

<section aria-label="รอบรายงานปัจจุบัน" style="padding: 18px; border-radius: 16px; background: #0F7A4A; color: #FFFFFF; box-shadow: 0 10px 24px rgba(15,122,74,.28)">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 13px; font-weight: 600; color: #DDF1E6">รอบรายงาน มี.ค. 2570</span>
<span style="font-size: 13px; color: #DDF1E6">ครบกำหนด 5 เม.ย.</span>
</div>
<div class="num" style="font-size: 30px; font-weight: 700; margin-top: 4px">ส่งแล้ว 2 <span style="font-size: 18px; font-weight: 500">/ 4 กิจกรรม</span></div>
<div role="progressbar" aria-label="ส่งรายงานแล้ว 2 จาก 4" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 999px; background: rgba(255,255,255,.25); margin-top: 10px; overflow: hidden"><div style="width: 50%; height: 100%; background: #FFFFFF; border-radius: 999px"></div></div>
</section>

<div role="tablist" aria-label="สถานะงาน" class="glass" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="seg" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}} <span class="num">({{t.n}})</span></button></sc-for>
</div>

<ul role="tabpanel" aria-label="{{panelLabel}}" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="c" hint-placeholder-count="3">
<li class="glass" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #0B6B41"><span class="num">{{c.no}}</span> · {{c.val}}</span>
<span class="chip {{c.cls}}">{{c.chip}}</span>
</div>
<div style="font-weight: 600; line-height: 1.5">{{c.name}}</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #2E4A3D">
<span>ผล <strong class="num" style="color: #0F2A1F">{{c.res}}</strong></span>
<span style="color: {{c.dueFg}}; font-weight: 600">{{c.due}}</span>
</div>
<a class="cta" href="{{c.href}}" style="background: {{c.ctaBg}}; color: {{c.ctaFg}}; border: {{c.ctaBd}}">{{c.cta}}</a>
</li>
</sc-for>
</ul>
</div>

<nav aria-label="เมนูหลัก" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding: 0 8px 8px; display: flex; background: rgba(255,255,255,.82); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border-top: 1px solid rgba(15,42,31,.08)">
<a class="bn" href="Main.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>ภาพรวม</a>
<a class="bn on" href="MyTasks.dc.html" aria-current="page"><span style="padding: 2px 16px; border-radius: 999px; background: #E3F4EA; display: flex"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M9 15h6M9 11h2"></path></svg></span>งานของฉัน</a>
<a class="bn" href="Activities.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8M13 12h8M13 18h8"></path></svg>กิจกรรม</a>
<a class="bn" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>Do &amp; Don't</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'todo' }; }
  renderVals() {
    const primary = { ctaBg: '#0F7A4A', ctaFg: '#FFFFFF', ctaBd: 'none' };
    const ghost = { ctaBg: 'rgba(255,255,255,.8)', ctaFg: '#0B5C37', ctaBd: '1px solid rgba(15,42,31,.16)' };
    const D = {
      todo: [
        { no: '2.2', val: 'Unity', name: 'การรวบรวมข้อมูลและวิเคราะห์ผลกระทบด้านความเสี่ยง', res: '1 / 4 ครั้ง', cls: 's-late', chip: '! เลยกำหนด 5 วัน', due: 'รอบ มี.ค. · ส่ง 5 เม.ย.', dueFg: '#7A4100', cta: 'รายงานผลรอบนี้', href: 'Report.dc.html', ...primary },
        { no: '4.2', val: 'Beyond Service', name: 'พัฒนาศักยภาพเจ้าของความเสี่ยงและการให้คำปรึกษารายไตรมาส', res: '82 / 90 %', cls: 's-risk', chip: '↩ ส่งกลับแก้ไข', due: 'รอบ มี.ค. · ส่ง 5 เม.ย.', dueFg: '#9A2B06', cta: 'แก้ไขตามความเห็น', href: 'Report.dc.html', ...primary },
        { no: '3.2', val: 'Be Innovative', name: 'ระบบเตือนภัยล่วงหน้า Early Warning System (EWS)', res: '6 / 12 ครั้ง', cls: 's-na', chip: '○ รอบถัดไป', due: 'รอบ เม.ย. · ส่ง 5 พ.ค.', dueFg: '#2E4A3D', cta: 'เริ่มร่างรายงาน', href: 'Report.dc.html', ...ghost }
      ],
      review: [
        { no: '6.3', val: 'Responsibility', name: 'การบูรณาการจุดควบคุมในขั้นตอนการปฏิบัติงานมาตรฐานและระบบดิจิทัล', res: '55 / 80 %', cls: 's-info', chip: 'รอหัวหน้ากลุ่มงานตรวจ', due: 'ส่งเมื่อ 4 เม.ย.', dueFg: '#2E4A3D', cta: 'ดูรายงาน', href: 'Report.dc.html', ...ghost }
      ],
      done: [
        { no: '1.3', val: 'Rules', name: 'ผู้บริหารสื่อสารความเสี่ยงและสร้างแบบอย่างจากผู้นำ', res: '2 / 4 ครั้ง', cls: 's-done', chip: '✓ อนุมัติแล้ว', due: 'อนุมัติ 8 เม.ย.', dueFg: '#14653F', cta: 'ดูรายงาน', href: 'Report.dc.html', ...ghost }
      ]
    };
    const L = { todo: 'ต้องส่ง', review: 'รอตรวจ', done: 'เสร็จ' };
    const tab = this.state.tab;
    const tabs = Object.keys(L).map((k) => ({ label: L[k], n: D[k].length, sel: tab === k ? 'true' : 'false', pick: () => this.setState({ tab: k }) }));
    return { tabs, items: D[tab], panelLabel: 'งาน' + L[tab] };
  }
}
</script>
</body>
</html>
